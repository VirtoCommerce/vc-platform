<header class="header">
    <!-- Small screens (modern look): the main menu becomes a drawer opened from here -->
    <button type="button" class="header__menu-toggle" ng-click="toggleMobileMenu($event)"
            title="{{'platform.menu.main-menu' | translate}}" aria-label="{{'platform.menu.main-menu' | translate}}">
        <i class="fa fa-bars" aria-hidden="true"></i>
    </button>
    <img class="header__mobile-logo" alt="" ng-src="{{ uiCustomization.topPanelLogo_mini_custom.url || uiCustomization.topPanelLogo_mini_default.url }}" />
    <va-global-search></va-global-search>
    <!-- the environment label lives in the header; the floating page banner stays for screens without a header (sign-in) -->
    <vc-environment-banner class="header__env" environment-name="{{environmentName}}" theme="{{environmentTheme}}" ng-if="showEnvironmentBanner"></vc-environment-banner>
    <va-header-license-widget></va-header-license-widget>
    <va-header-password-widget></va-header-password-widget>

    <div class="header__nav">
        <div class="header__nav-item header__nav-item--theme" ng-class="{'header__nav-item--opened': themeMenuOpen}">
            <button type="button" class="header__nav-ico header__nav-ico--theme" ng-click="toggleThemeMenu($event)"
                    title="{{'platform.menu.theme' | translate}}" aria-label="{{'platform.menu.theme' | translate}}" aria-haspopup="true" aria-expanded="{{themeMenuOpen}}">
                <i class="fas fa-adjust" aria-hidden="true"></i>
            </button>
            <ul class="dropdown-menu theme-menu" role="menu">
                <li ng-repeat="theme in themeOptions" role="none">
                    <button type="button" role="menuitemradio" aria-checked="{{themeService.current === theme.id}}" class="dropdown-menu__item theme-menu__item"
                            ng-class="{'theme-menu__item--active': themeService.current === theme.id}" ng-click="selectTheme(theme)">
                        <i class="theme-menu__icon" ng-class="theme.icon" aria-hidden="true"></i>
                        <span>{{theme.title | translate}}</span>
                        <i class="theme-menu__check fas fa-check" ng-if="themeService.current === theme.id" aria-hidden="true"></i>
                    </button>
                </li>
            </ul>
        </div>
        <div class="header__nav-item" va-tooltip tooltip="{{'platform.menu.settings' | translate}}"
             tooltip-placement="bottom" tooltip-animation="false" tooltip-popup-delay="{{tooltipPopupDelay}}">
            <span class="header__nav-ico header__nav-ico--settings" ng-click="manageSettings()"></span>
        </div>
        <div class="header__nav-item" va-tooltip tooltip="{{'platform.menu.help' | translate}}"
             tooltip-placement="bottom" tooltip-animation="false" tooltip-popup-delay="{{tooltipPopupDelay}}">
            <a class="header__nav-ico header__nav-ico--help" href="https://virtocommerce.com/docs" target="_blank"></a>
        </div>
        <va-header-notification-widget></va-header-notification-widget>
        <va-header-user-profile-widget></va-header-user-profile-widget>
    </div>
</header>
