<div class="blade-content">
  <div class="blade-inner">
    <div class="inner-block clearfix sign-in-log-detail-body">
      <div class="detail-badges">
        <span class="sign-in-log-badge" ng-class="outcome.cssClass">
          {{ outcome.label | translate }}
        </span>
        <span class="sign-in-log-badge __impersonation" ng-if="isImpersonation">
          {{ 'platform.blades.sign-in-log.labels.impersonation' | translate }}
        </span>
      </div>

      <form name="formScope" class="form sign-in-log-detail">
        <va-metaform registered-inputs="blade.metaFields" blade="blade" column-count="1"></va-metaform>
      </form>
    </div>
  </div>
</div>
