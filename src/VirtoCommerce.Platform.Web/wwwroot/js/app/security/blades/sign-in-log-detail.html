<div class="blade-content __medium-wide">
  <div class="blade-inner">
    <div class="inner-block sign-in-log-detail">

      <div class="detail-badges">
        <span class="sign-in-log-badge" ng-class="blade.currentEntity.succeeded ? '__success' : '__failed'">
          {{ (blade.currentEntity.succeeded ? 'platform.blades.sign-in-log.labels.succeeded' : 'platform.blades.sign-in-log.labels.failed') | translate }}
        </span>
        <span class="sign-in-log-badge __impersonation" ng-if="isImpersonation">
          {{ 'platform.blades.sign-in-log.labels.impersonation' | translate }}
        </span>
      </div>

      <va-metaform registered-inputs="blade.metaFields" blade="blade" column-count="1"></va-metaform>

    </div>
  </div>
</div>
