<div class="sign-in-key__content" ng-controller="platformWebApp.passwordSignInKeyController">
  <span class="sign-in-key__icon fas fa-lock"></span>
  <div class="sign-in-key__info">
    <div class="sign-in-key__name">
      <span class="list-t sign-in-key__name-text">{{ 'platform.blades.sign-in-methods-list.labels.password-set' | translate }}</span>
      <a href="" class="form-edit" ng-click="changePassword()" title="{{ 'platform.commands.change-password' | translate }}"><span class="form-ico fa fa-pencil"></span></a>
    </div>
    <div class="list-descr" ng-if="key.modifiedDate">{{ 'platform.blades.sign-in-methods-list.labels.changed' | translate }} {{ key.modifiedDate | amParse | date:'mediumDate' }}</div>
  </div>
</div>
