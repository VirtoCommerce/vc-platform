<div class="blade-content">
  <div class="blade-inner">
    <div class="inner-block">
      <div class="form">
        <div class="form-group list __info" ng-repeat="signInMethod in blade.currentEntities">
          <hr ng-if="!$first" />
          <label class="form-label">{{ getTitle(signInMethod) | translate }}</label>
          <div class="form-nav" ng-if="signInMethod.canCreateKey">
            <a href="" ng-click="createKey(signInMethod)" title="{{ 'platform.commands.add' | translate }}"><span class="fa fa-plus"></span></a>
          </div>
          <div class="sign-in-key" ng-repeat="key in signInMethod.keys">
            <div class="sign-in-key__template" ng-include="getKeyTemplateUrl(signInMethod)"></div>
            <a href="" ng-if="signInMethod.canDeleteKey" ng-click="deleteKey(signInMethod, key)" title="{{ 'platform.commands.delete' | translate }}"><span class="fas fa-trash-alt"></span></a>
          </div>
          <div class="list-descr" ng-if="!signInMethod.keys.length">{{ getNoKeysTitle(signInMethod) | translate }}</div>
        </div>
      </div>
    </div>
  </div>
</div>
